# fly.toml app configuration file generated for znagadeon-memos on 2026-11-09T08:18:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'znagadeon-memos'
primary_region = 'nrt'

[build]
  image = 'neosmemo/memos:26.11.0'

[env]
  MEMOS_DATA = '/var/opt/memos'
  MEMOS_INSTANCE_URL = 'https://znagadeon-memos.fly.dev'
  MEMOS_PORT = '5230'

[[mounts]]
  source = 'memos_data'
  destination = '/var/opt/memos'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
